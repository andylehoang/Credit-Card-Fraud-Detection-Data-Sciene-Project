name: fraud-detection-legacy
channels:
  - rapidsai
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Python - Downgraded for RAPIDS 23.12 compatibility
  - python=3.10

  # Core data science - Downgraded to match RAPIDS 23.12 constraints
  - numpy<2.0
  - pandas<2.0
  - scipy=1.10

  # Visualization
  - matplotlib=3.7
  - seaborn=0.12
  - plotly=5.18

  # Machine Learning
  - scikit-learn=1.3
  - imbalanced-learn=0.11

  # GPU-accelerated ML (RAPIDS) - Integrated into the file
  - cudf=23.12
  - cuml=23.12
  - cuda-version=11.2

  # Jupyter ecosystem
  - jupyter=1.0
  - notebook=6.5
  - ipykernel=6.25

  # Utilities
  - joblib=1.3
  - tqdm=4.66
  - openpyxl=3.1

  # TensorFlow
  - pip
  - pip:
      - tensorflow==2.11.0
      - tensorflow-gpu==2.11.0

