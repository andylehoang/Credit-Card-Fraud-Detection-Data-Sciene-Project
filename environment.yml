name: fraud-detection
channels:
  - conda-forge
  - defaults
dependencies:
  # Python
  - python=3.12

  # Core data science
  - numpy=2.1
  - pandas=2.2
  - scipy=1.14

  # Visualization
  - matplotlib=3.10
  - seaborn=0.13
  - plotly=5.24

  # Machine Learning
  - scikit-learn=1.6
  - imbalanced-learn=0.12

  # Jupyter ecosystem
  - jupyter=1.1
  - notebook=7.3
  - ipykernel=6.29

  # Utilities
  - joblib=1.4
  - tqdm=4.67
  - openpyxl=3.1

  # TensorFlow (pip required - conda-forge is outdated on Windows)
  - pip
  - pip:
      - tensorflow==2.20.0
